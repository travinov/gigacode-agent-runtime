schema_version: gigacode-agent-runtime/scenario-v1
kind: Scenario

metadata:
  name: cycle-invalid
  title: Invalid cyclic scenario

agents:
  analyst:
    model: code-model-id
    permissions: read_only
    system_prompt: Analyze.

steps:
  first:
    kind: agent
    agent: analyst
    needs: [second]
    prompt:
      template: First.
    output_schema:
      type: object

  second:
    kind: agent
    agent: analyst
    needs: [first]
    prompt:
      template: Second.
    output_schema:
      type: object

result:
  from: "${steps.second.output}"
